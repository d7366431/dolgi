:root{
  --bg:#E9EEF1; --surface:#F7F9FA; --surface-2:#DFE6EA; --ink:#17212B; --ink-2:#4A5765; --ink-3:#7A8794;
  --line:#C9D3D9; --accent:#0F7A62; --accent-ink:#FFFFFF; --accent-soft:#D3EBE3;
  --warn:#A9620A; --warn-soft:#F6E7CF; --danger:#B0302A; --danger-soft:#F5DAD7;
  --plan:#2E4A7A; --fact:#0F7A62;
  --r-lg:18px; --r-md:12px; --r-sm:8px;
  --f-ui:"Onest", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --f-disp:"Unbounded", "Onest", -apple-system, Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1419; --surface:#171E25; --surface-2:#212A33; --ink:#E4EAEF; --ink-2:#AAB6C1; --ink-3:#7D8A96;
    --line:#2C3741; --accent:#3DBB98; --accent-ink:#06231B; --accent-soft:#163A30;
    --warn:#E3A44B; --warn-soft:#3A2C16; --danger:#EF7A72; --danger-soft:#3D1D1B;
    --plan:#8EA9DA; --fact:#3DBB98; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1419; --surface:#171E25; --surface-2:#212A33; --ink:#E4EAEF; --ink-2:#AAB6C1; --ink-3:#7D8A96;
  --line:#2C3741; --accent:#3DBB98; --accent-ink:#06231B; --accent-soft:#163A30;
  --warn:#E3A44B; --warn-soft:#3A2C16; --danger:#EF7A72; --danger-soft:#3D1D1B;
  --plan:#8EA9DA; --fact:#3DBB98; color-scheme: dark;
}

:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.4;font-variant-numeric:tabular-nums;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
svg{max-width:100%}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:760px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-left,0px)) 6px max(16px,env(safe-area-inset-right,0px))}
.topbar h1{font-family:var(--f-disp);font-weight:700;font-size:22px;margin:0;letter-spacing:-.01em}
main{max-width:760px;margin:0 auto;padding:6px max(12px,env(safe-area-inset-left,0px)) 24px max(12px,env(safe-area-inset-right,0px))}
section.view[hidden]{display:none}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;min-height:52px;font-size:12px;color:var(--ink-2);cursor:pointer;border-radius:10px}
.tabbar svg{width:24px;height:24px}
.tabbar button[aria-current="true"]{color:var(--accent);font-weight:600}
@media (min-width:900px){body{padding-bottom:24px}.tabbar{position:static;max-width:760px;margin:0 auto 8px;border:1px solid var(--line);border-radius:14px;padding:4px;grid-template-columns:repeat(4,1fr)}.tabbar button{flex-direction:row;justify-content:center;gap:8px;font-size:15px;min-height:44px}.tabbar svg{width:20px;height:20px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;margin:0 0 12px}
.card h2{font-size:17px;font-weight:600;margin:0 0 8px}
.card.empty{text-align:center;color:var(--ink-2)}
.hero-card .big{margin-top:6px}
.big{font-family:var(--f-disp);font-weight:700;font-size:clamp(34px,10vw,48px);line-height:1.05;letter-spacing:-.01em;margin:4px 0 2px}
.label{font-size:13px;color:var(--ink-2)}
.sub{color:var(--ink-2);font-size:14px;margin:0 0 10px}
.hint{color:var(--ink-3);font-size:13px;margin:10px 0 0}
.small{font-size:13px}.muted{color:var(--ink-3)}.pos{color:var(--accent)}.neg{color:var(--danger)}
.num{text-align:right;white-space:nowrap;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:4px}
.cats{display:grid;gap:10px;margin-top:14px}
.cat{font-size:14px}.cat .bar{height:6px;margin-top:5px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;min-height:44px;cursor:pointer;font-weight:500;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.tiny{min-height:34px;padding:5px 12px;font-size:14px;border-radius:10px}
.btn.wide{width:100%;margin-top:8px}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.35}
.actions .btn{flex:1 1 140px}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li.done{opacity:.6}
.li.negrow .date{background:var(--danger-soft)}
.li-btn{width:100%;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;cursor:pointer;color:inherit}
.grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ellip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.date{width:48px;height:48px;flex:none;border-radius:12px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.date b{font-size:18px}.date span{font-size:11px;color:var(--ink-2)}
.date.sm{width:40px;height:40px}.date.sm b{font-size:15px}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:baseline;flex:none}
.big-dot{width:12px;height:12px;margin:0}
.chev{font-size:24px;color:var(--ink-3)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.kv b{display:block;font-size:16px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:12px;padding:3px;margin:0 0 12px}
.seg button{border:0;background:none;border-radius:10px;min-height:38px;cursor:pointer;font-weight:500;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.period{margin:4px 0 6px}
.cat-btn{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 0;cursor:pointer;color:inherit;font-size:15px;border-radius:8px}
.cat-btn.on{background:var(--surface-2);padding:9px 8px}
.chip-cat{align-self:flex-start;border:1px solid var(--line);background:var(--bg);border-radius:999px;font-size:12px;padding:2px 9px;color:var(--ink-2);cursor:pointer}
.sublist{padding:4px 0 10px 12px;border-bottom:1px solid var(--line);display:grid;gap:6px}
details.more summary,details.card summary{cursor:pointer;color:var(--ink-2);font-size:14px;padding:10px 0 2px;list-style:none}
details.more summary::before,details.card summary::before{content:'▸ ';}
details[open].more summary::before,details[open].card summary::before{content:'▾ ';}
details.card summary{font-weight:600;color:var(--ink);font-size:16px;padding:0}
.alert{border-radius:var(--r-md);padding:12px 14px;font-size:14px;margin:0 0 10px;border:1px solid transparent}
.alert summary{cursor:pointer;font-weight:600;list-style:none}
.alert div{margin-top:6px;color:var(--ink-2)}
.alert.warn{background:var(--warn-soft)}.alert.danger{background:var(--danger-soft)}
.mini-chart{display:block;width:100%;height:auto;margin-top:6px}
.debt-chart{display:block;width:100%;height:auto;margin-top:6px;touch-action:pan-y}
.dc-info{font-size:14px;color:var(--ink-2);background:var(--surface-2);border-radius:10px;padding:8px 10px;margin-top:8px;min-height:38px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}
.dc-info .btn{min-height:28px;padding:2px 8px;font-size:13px}
.lg-keys{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink-3);margin:6px 0 4px;align-items:center}
.lg-keys span{display:inline-flex;align-items:center;gap:5px}
.legend2{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;margin-top:6px}
@media (min-width:560px){.legend2{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:2px 14px}}
.lg{display:flex;width:100%;min-width:0;align-items:center;gap:6px;background:none;border:0;padding:6px 4px;border-radius:8px;cursor:pointer;color:inherit;text-align:left;font-size:13px;min-height:36px}
.lg .lg-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg .lg-v{color:var(--ink-3);white-space:nowrap;font-size:12px}
.lg.on{background:var(--surface-2)}.lg.dim{opacity:.45}
.chart{position:relative}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.4;min-width:170px;max-width:240px;transform:translateX(-50%);display:none;z-index:3;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.num-in{width:110px;text-align:right;min-height:40px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 10px;font-size:16px}
.day-in{width:62px;min-height:40px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 8px;font-size:16px}
.grow-in{flex:1;min-width:0;min-height:40px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 10px;font-size:16px}
.ev{padding:10px 0;border-bottom:1px solid var(--line);display:grid;gap:8px}
.ev-row{display:flex;gap:8px;align-items:center}
.ev-row input[type=month]{flex:1;min-width:0;min-height:40px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 8px;font-size:15px}
.back{margin:0 0 8px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-3)}
.sync i{width:9px;height:9px;border-radius:50%;background:var(--ink-3);display:inline-block}
.sync.on i{background:var(--accent)}.sync.err i{background:var(--danger)}
.sync.dot-only span{display:none}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px 14px;align-items:start}
.field{display:grid;gap:4px;align-content:start}
.field label,.flabel{font-size:13px;color:var(--ink-2)}
.field .help{font-size:12px;color:var(--ink-3)}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=number],input[type=month],select,textarea{width:100%;min-height:44px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;font-size:16px}
input.num-in{width:116px;flex:none}input.day-in{width:64px;flex:none}input.grow-in{width:auto;flex:1;min-width:0}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.amt{white-space:nowrap;text-align:right}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;min-height:36px;padding:4px 12px;cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
dialog{border:0;border-radius:20px;padding:0;max-width:min(560px,96vw);width:100%;background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,15,20,.5)}
.dlg-body{padding:20px;display:grid;gap:14px;max-height:75vh;overflow:auto}
.dlg-body h3{margin:0;font-size:19px}
.dlg-foot{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.dlg-foot .btn{flex:1 1 auto}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;max-width:92vw;text-align:center}
.toast.show{opacity:1}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
.neg-day .date{background:var(--danger-soft)}
#gate[hidden]{display:none}
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.gate-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;max-width:440px;width:100%;display:grid;gap:8px}
.gate-card h1{font-family:var(--f-disp);font-size:24px;margin:0 0 4px}
.form1{display:grid;gap:12px}.form1 .field span{font-size:13px;color:var(--ink-2)}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="gate" hidden></div>
<div id="app">
  <header class="topbar"><h1>Мои финансы</h1><span class="sync" data-sync="dot"></span></header>
  <nav class="tabbar" aria-label="Разделы">
    <button type="button" data-nav="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Сегодня</button>
    <button type="button" data-nav="expenses"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>Расходы</button>
    <button type="button" data-nav="payments"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Платежи</button>
    <button type="button" data-nav="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>Ещё</button>
  </nav>
  <main>
    <section class="view" id="v-today"></section>
    <section class="view" id="v-expenses" hidden></section>
    <section class="view" id="v-payments" hidden></section>
    <section class="view" id="v-more" hidden></section>
  </main>
</div>
<dialog id="dlg"><form method="dialog" id="dlgForm"><div class="dlg-body" id="dlgBody"></div><div class="dlg-foot" id="dlgFoot"></div></form></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
